# Ambiente LOCAL de desenvolvimento apenas. Não usar em produção.
services:
  postgres:
    image: postgres:16-alpine
    container_name: central-indicadores-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: central
      POSTGRES_PASSWORD: central
      POSTGRES_DB: central
    ports:
      - "5432:5432"
    volumes:
      - central_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U central"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  central_pgdata:
